apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: unify

spec:
  replicas: 1

  selector:
    matchLabels:
      app: frontend

  template:
    metadata:
      labels:
        app: frontend

    spec:
      containers:
        - name: frontend
          image: <ACCOUNT_ID>.dkr.ecr.ap-south-1.amazonaws.com/unify-frontend:latest

          imagePullPolicy: Always

          ports:
            - containerPort: 3000

          envFrom:
            - configMapRef:
                name: backend-config