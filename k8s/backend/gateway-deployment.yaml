apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: unify

spec:
  replicas: 1

  selector:
    matchLabels:
      app: gateway

  template:
    metadata:
      labels:
        app: gateway

    spec:
      containers:
        - name: gateway

          image: 564325282647.dkr.ecr.ap-south-1.amazonaws.com/unify-backend:latest

          imagePullPolicy: Always

          ports:
            - containerPort: 8000

          env:
            - name: SERVICE
              value: gateway

          envFrom:
            - configMapRef:
                name: unify-config
            - secretRef:
                name: unify-secret