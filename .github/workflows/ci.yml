name: CI

# Concept: TRIGGERS — this pipeline runs on every push (so you get feedback on
# any branch) and on every pull request targeting main (so bad code can't
# even be merged). Two triggers, one workflow.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  # Concept: JOBS run in parallel by default, each on its own fresh runner (VM).
  # Splitting backend/frontend/ai-agent into separate jobs means a failure in
  # one doesn't block the others from reporting, and they finish faster
  # together than they would running as one long sequential job.
  backend:
    name: Backend (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      # Concept: STEPS run in order, in this job, on this VM.
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  frontend:
    name: Frontend (lint + typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      # Concept: these are NOT secrets — NEXT_PUBLIC_* values get baked into the
      # client bundle anyway, so it's normal/safe to hardcode placeholders here
      # just so `next build` has something to inline. Real production values
      # live in Vercel's project settings, not here.
      NEXT_PUBLIC_APP_NAME: Unify
      NEXT_PUBLIC_APP_ENV: production
      NEXT_PUBLIC_API_URL: https://placeholder.invalid
      NEXT_PUBLIC_FRONTEND_URL: https://placeholder.invalid
      NEXT_PUBLIC_ENABLE_INTELLI: "true"
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

  ai-agent:
    name: AI Agent (syntax check)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-agent
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Deliberately NOT running `pip install -r requirements.txt` here:
      # chromadb / sentence-transformers / torch pull in huge downloads and
      # would make every CI run slow for a service that isn't deployed by
      # this pipeline yet. This is a cheap syntax/import-structure gate only.
      # Swap in a real `pip install` + `pytest` step once ai-agent has tests
      # and you're ready to pay the extra runtime.
      - name: Byte-compile all Python files (catches syntax errors)
        run: |
          find . -name "*.py" -not -path "./.venv/*" -print0 \
            | xargs -0 -r python -m py_compile